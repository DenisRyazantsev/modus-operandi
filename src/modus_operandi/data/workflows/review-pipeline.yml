# WARNING: the literal `timeout:` and `max_iterations:` values in this file
# are placeholders, not operative settings. The specify engine accepts only
# literal integers for these keys (no expressions), so the installer's
# modus_operandi/render.py `_patch_workflow_numbers` overwrites every `timeout`
# with workflow.shell_timeout and each loop's `max_iterations` with its
# max_*_iterations config value at install/`--apply` time — editing the
# numbers here silently has no effect on installed workflows. Everything
# else is delivered at runtime: state_dir arrives as an -i input, and the
# script paths come from the MO_SCRIPTS_DIR env var (defaulting to
# $HOME/.config/opencode/scripts for direct `specify workflow run`).
#
# CONTRIBUTING.md: this file contains NO bash scripts. Every shell step calls
# exactly one installed script (pipeline_scripts/) with quoted arguments; all
# logic lives in the scripts. The only shell syntax allowed in a run: value
# is the single path expansion locating the scripts directory.
schema_version: "1.0"
workflow:
  id: "review-pipeline"
  name: "Review Pipeline"
  version: "1.1.0"
  author: "modus-operandi"
  description: "Review your code and fix findings; by default the whole codebase, with -i branch-diff=true only the changes between the current branch and the default branch"

inputs:
  branch-diff:
    type: string
    required: false
    prompt: "true to review only the changes between the current branch and the default branch (otherwise the whole codebase is reviewed)"
  state_dir:
    type: string
    required: false
    default: ".workflow"
    prompt: "Task artifact directory inside the project (from workflow.state_dir)"

steps:
  - id: generate-task-id
    type: shell
    run: >-
      "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/review-task-id.sh"
      "{{ inputs.state_dir }}"

  - id: determine-scope
    type: shell
    run: >-
      "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/determine-scope.sh"
      "{{ inputs.state_dir }}"
      "{{ inputs.branch-diff }}"

  - id: review-fix-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
    steps:
      - id: pending-kinds
        type: shell
        run: >-
          python3 "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_review.py"
          pending "{{ inputs.state_dir }}" ""

      - id: review-fan
        type: fan-out
        max_concurrency: 4
        items: "{{ steps.pending-kinds.output.stdout | from_json }}"
        step:
          id: check
          type: shell
          timeout: 7200
          run: >-
            "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/review-check.sh"
            "{{ inputs.state_dir }}"
            ""
            "{{ item }}"
            review

      - id: merge-reports
        type: shell
        continue_on_error: true
        run: >-
          python3 "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_review.py"
          merge "{{ inputs.state_dir }}" ""

      - id: fix-branch
        type: if
        condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
        then:
          - id: fix-all
            type: shell
            timeout: 7200
            run: >-
              "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
              "{{ inputs.state_dir }}"
              executor
              fix-all.md

  - id: pass-check
    type: shell
    run: >-
      "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/pass-check.sh"
      "{{ inputs.state_dir }}"
      ""

  # ADR-0019: the very last step of the run - the executor (warm session)
  # writes a high-level summary of what was done; a missing summary is
  # unexpected behavior and degrades to a warning (summary-check exits 1,
  # the step carries continue_on_error), never to a run failure; the
  # summary is shown through show-file.sh when present.
  - id: summary
    type: shell
    timeout: 7200
    run: >-
      "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
      "{{ inputs.state_dir }}"
      executor
      summary.md

  - id: summary-check
    type: shell
    continue_on_error: true
    run: >-
      python3 "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_summary.py"
      check "{{ inputs.state_dir }}" ""

  - id: summary-display
    type: if
    condition: "{{ steps.summary-check.output.exit_code == 0 }}"
    then:
      - id: summary-display-file
        type: shell
        run: >-
          "${MO_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/show-file.sh"
          "{{ inputs.state_dir }}"
          "tasks/current/summary.md"

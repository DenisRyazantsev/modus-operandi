# WARNING: the literal `timeout:` and `max_iterations:` values in this file
# are placeholders, not operative settings. The specify engine accepts only
# literal integers for these keys (no expressions), so the installer's
# spec_utils/render.py `_patch_workflow_numbers` overwrites every `timeout`
# with workflow.shell_timeout and each loop's `max_iterations` with its
# max_*_iterations config value at install/`--apply` time — editing the
# numbers here silently has no effect on installed workflows. Everything
# else is delivered at runtime: state_dir arrives as an -i input, and the
# script paths come from the SKLC_SCRIPTS_DIR env var (defaulting to
# $HOME/.config/opencode/scripts for direct `specify workflow run`).
schema_version: "1.0"
workflow:
  id: "review-pipeline"
  name: "Review Pipeline"
  version: "1.1.0"
  author: "spec-kit-llm-client"
  description: "Review your code and fix findings; by default the whole codebase, with -i branch-diff=true only the changes between the current branch and the default branch"

inputs:
  branch-diff:
    type: string
    required: false
    prompt: "true to review only the changes between the current branch and the default branch (otherwise the whole codebase is reviewed)"
  state_dir:
    type: string
    required: false
    default: ".workflow"
    prompt: "Task artifact directory inside the project (from workflow.state_dir)"

steps:
  - id: generate-task-id
    type: shell
    run: >-
      set -euo pipefail;
      mkdir -p "{{ inputs.state_dir }}/tasks";
      branch=$(git branch --show-current 2>/dev/null || true);
      slug=$(printf '%s' "${branch:-review}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40);
      [ -n "$slug" ] || slug=review;
      tid="$slug-$(date +%Y%m%d-%H%M)";
      mkdir -p "{{ inputs.state_dir }}/tasks/$tid";
      ln -sfn "$tid" "{{ inputs.state_dir }}/tasks/current";
      echo "task id: $tid";

  - id: determine-scope
    type: shell
    # `git diff --quiet` ignores untracked files, so a branch (or fresh repo)
    # containing only NEW files would falsely report "no changes"; the
    # untracked-file check counts them as changes too. (YAML comments do not
    # survive rendering into the installed workflow, and #-comments inside the
    # folded >- run block would swallow the rest of the script.)
    run: >-
      set -euo pipefail;
      if [ "{{ inputs.branch-diff }}" = "true" ]; then
      base="";
      if git symbolic-ref -q refs/remotes/origin/HEAD >/dev/null 2>&1; then
      base=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/@@');
      fi;
      if [ -z "$base" ]; then
      for b in origin/main origin/master main master; do
      if git rev-parse --verify --quiet "$b" >/dev/null 2>&1; then base="$b"; break; fi;
      done;
      fi;
      if [ -z "$base" ]; then
      echo "WARNING: no main/master branch found; reviewing against HEAD";
      base="HEAD";
      fi;
      if git diff "$base" --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
      echo "error: no changes against $base - nothing to review" >&2; exit 1;
      fi;
      printf '%s' "$base" > "{{ inputs.state_dir }}/base-branch.txt";
      printf 'branch-diff: %s' "$base" > "{{ inputs.state_dir }}/scope.txt";
      echo "mode: branch-diff (base: $base)";
      else
      rm -f "{{ inputs.state_dir }}/base-branch.txt";
      printf 'full' > "{{ inputs.state_dir }}/scope.txt";
      echo "mode: full codebase review";
      fi;

  - id: warm-planner
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
      # The four parallel checks each run in a FORK of this warm planner
      # session (ADR-0009). The cursor backend has no fork primitive, so the
      # checks there mint fresh chats and the warm-up is pointless: skip it.
      if [ "${SKLC_BACKEND:-opencode}" = "cursor" ]; then
      echo "cursor backend: skipping warm-up (parallel checks mint fresh chats)";
      exit 0;
      fi;
      export STATE_DIR="{{ inputs.state_dir }}";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/warmup.md";

  - id: review-fix-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
    steps:
      - id: pending-kinds
        type: shell
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" pending "{{ inputs.state_dir }}" ""

      - id: review-fan
        type: fan-out
        max_concurrency: 4
        items: "{{ steps.pending-kinds.output.stdout | from_json }}"
        step:
          id: check
          type: shell
          timeout: 7200
          run: |-
            SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
            PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
            set -euo pipefail;
            # One review per kind, each in its own FORK of the warm planner
            # session (ADR-0009): the checks run in parallel and never mutate
            # the parent session, whose id stays in the session store. A
            # snapshot file from a previous iteration selects the re-review
            # prompt, which diffs the fixed code against @SNAP@.
            ITEM="{{ item }}";
            case "$ITEM" in
              srp) PREFIX=srp-review; PROMPT=review/srp-review.md; REREVIEW=review/srp-rereview.md;;
              bugs) PREFIX=bug-review; PROMPT=review/bug-review.md; REREVIEW=review/bug-rereview.md;;
              review) PREFIX=review; PROMPT=review/review.md; REREVIEW=review/review-rereview.md;;
              comment) PREFIX=comment-review; PROMPT=review/comment-review.md; REREVIEW=review/comment-rereview.md;;
              *) echo "error: unknown review kind '$ITEM'" >&2; exit 2;;
            esac;
            latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" "$ITEM" 2>/dev/null || true);
            n=1;
            if [ -n "$latest" ]; then
            b=$(basename "$latest");
            num=${b#$PREFIX-};
            num=${num%.md};
            case "$num" in ''|*[!0-9]*) num=0;; esac;
            n=$((num+1));
            fi;
            export STATE_DIR="{{ inputs.state_dir }}";
            export LATEST="$latest";
            export N="$n";
            snapfile="{{ inputs.state_dir }}/tasks/current/$ITEM-snapshot.sha";
            if [ -s "$snapfile" ]; then
            snap=$(cat "$snapfile");
            export SNAP="$snap";
            "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --fork --prompt-file "$PROMPTS_DIR/$REREVIEW";
            else
            "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --fork --prompt-file "$PROMPTS_DIR/$PROMPT";
            fi;
            snap=$(git stash create 2>/dev/null || true);
            [ -n "$snap" ] || snap=HEAD;
            printf '%s' "$snap" > "$snapfile";

      - id: merge-reports
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" merge "{{ inputs.state_dir }}" ""

      - id: fix-branch
        type: if
        condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
        then:
          - id: fix-all
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
              export STATE_DIR="{{ inputs.state_dir }}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor --prompt-file "$PROMPTS_DIR/fix-all.md"

  - id: pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      fails="";
      for kind in srp bugs review comment; do
      if ! python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" "$kind" >/dev/null 2>&1; then
      fails="$fails $kind";
      fi;
      done;
      if [ -z "$fails" ]; then
      echo "REVIEW OK: all verdicts PASS";
      else
      echo "WARNING: review loop exhausted all iterations without pass (kinds:$fails); inspect the latest review files and the code";
      fi

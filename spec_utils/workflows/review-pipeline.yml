# WARNING: the literal `timeout:` and `max_iterations:` values in this file
# are placeholders, not operative settings. The specify engine accepts only
# literal integers for these keys (no expressions), so the installer's
# spec_utils/render.py `_patch_workflow_numbers` overwrites every `timeout`
# with workflow.shell_timeout and each loop's `max_iterations` with its
# max_*_iterations config value at install/`--apply` time — editing the
# numbers here silently has no effect on installed workflows. Everything
# else is delivered at runtime: state_dir arrives as an -i input, and the
# script paths come from the SKLC_SCRIPTS_DIR env var (defaulting to
# $HOME/.config/opencode/scripts for direct `specify workflow run`).
schema_version: "1.0"
workflow:
  id: "review-pipeline"
  name: "Review Pipeline"
  version: "1.1.0"
  author: "spec-kit-llm-client"
  description: "Review your code and fix findings; by default the whole codebase, with -i branch-diff=true only the changes between the current branch and the default branch"

inputs:
  branch-diff:
    type: string
    required: false
    prompt: "true to review only the changes between the current branch and the default branch (otherwise the whole codebase is reviewed)"
  state_dir:
    type: string
    required: false
    default: ".workflow"
    prompt: "Task artifact directory inside the project (from workflow.state_dir)"

steps:
  - id: generate-task-id
    type: shell
    run: >-
      set -euo pipefail;
      mkdir -p "{{ inputs.state_dir }}/tasks";
      branch=$(git branch --show-current 2>/dev/null || true);
      slug=$(printf '%s' "${branch:-review}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40);
      [ -n "$slug" ] || slug=review;
      tid="$slug-$(date +%Y%m%d-%H%M)";
      mkdir -p "{{ inputs.state_dir }}/tasks/$tid";
      ln -sfn "$tid" "{{ inputs.state_dir }}/tasks/current";
      echo "task id: $tid";

  - id: determine-scope
    type: shell
    # `git diff --quiet` ignores untracked files, so a branch (or fresh repo)
    # containing only NEW files would falsely report "no changes"; the
    # untracked-file check counts them as changes too. (YAML comments do not
    # survive rendering into the installed workflow, and #-comments inside the
    # folded >- run block would swallow the rest of the script.)
    run: >-
      set -euo pipefail;
      if [ "{{ inputs.branch-diff }}" = "true" ]; then
      base="";
      if git symbolic-ref -q refs/remotes/origin/HEAD >/dev/null 2>&1; then
      base=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/@@');
      fi;
      if [ -z "$base" ]; then
      for b in origin/main origin/master main master; do
      if git rev-parse --verify --quiet "$b" >/dev/null 2>&1; then base="$b"; break; fi;
      done;
      fi;
      if [ -z "$base" ]; then
      echo "WARNING: no main/master branch found; reviewing against HEAD";
      base="HEAD";
      fi;
      if git diff "$base" --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
      echo "error: no changes against $base - nothing to review" >&2; exit 1;
      fi;
      printf '%s' "$base" > "{{ inputs.state_dir }}/base-branch.txt";
      printf 'branch-diff: %s' "$base" > "{{ inputs.state_dir }}/scope.txt";
      echo "mode: branch-diff (base: $base)";
      else
      rm -f "{{ inputs.state_dir }}/base-branch.txt";
      printf 'full' > "{{ inputs.state_dir }}/scope.txt";
      echo "mode: full codebase review";
      fi;

  - id: srp-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.srp-verdict.output.exit_code != 0 }}"
    steps:
      - id: srp-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
          set -euo pipefail;
          latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" srp 2>/dev/null || true);
          n=1;
          if [ -n "$latest" ]; then
          b=$(basename "$latest");
          num=${b#srp-review-};
          num=${num%.md};
          case "$num" in ''|*[!0-9]*) num=0;; esac;
          n=$((num+1));
          fi;
          export STATE_DIR="{{ inputs.state_dir }}";
          export LATEST="$latest";
          export N="$n";
          snapfile="{{ inputs.state_dir }}/tasks/current/srp-snapshot.sha";
          if [ -s "$snapfile" ]; then
          snap=$(cat "$snapfile");
          export SNAP="$snap";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/srp-rereview.md";
          else
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/srp-review.md";
          fi;
          snap=$(git stash create 2>/dev/null || true);
          [ -n "$snap" ] || snap=HEAD;
          printf '%s' "$snap" > "$snapfile";

      - id: srp-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" srp

      - id: srp-fix-branch
        type: if
        condition: "{{ steps.srp-verdict.output.exit_code != 0 }}"
        then:
          - id: srp-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
              latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" srp 2>/dev/null || true);
              export STATE_DIR="{{ inputs.state_dir }}";
              export LATEST="$latest";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor --prompt-file "$PROMPTS_DIR/srp-fix.md";

  - id: srp-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" srp 2>/dev/null); then
      echo "SRP REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: SRP review loop exhausted all iterations without 'SRP: PASS' (latest review: ${last:-none}); inspect the latest srp-review file and the code";
      fi

  - id: bug-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.bug-verdict.output.exit_code != 0 }}"
    steps:
      - id: bug-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
          set -euo pipefail;
          latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" bugs 2>/dev/null || true);
          n=1;
          if [ -n "$latest" ]; then
          b=$(basename "$latest");
          num=${b#bug-review-};
          num=${num%.md};
          case "$num" in ''|*[!0-9]*) num=0;; esac;
          n=$((num+1));
          fi;
          export STATE_DIR="{{ inputs.state_dir }}";
          export LATEST="$latest";
          export N="$n";
          snapfile="{{ inputs.state_dir }}/tasks/current/bug-snapshot.sha";
          if [ -s "$snapfile" ]; then
          snap=$(cat "$snapfile");
          export SNAP="$snap";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/bug-rereview.md";
          else
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/bug-review.md";
          fi;
          snap=$(git stash create 2>/dev/null || true);
          [ -n "$snap" ] || snap=HEAD;
          printf '%s' "$snap" > "$snapfile";

      - id: bug-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" bugs

      - id: bug-fix-branch
        type: if
        condition: "{{ steps.bug-verdict.output.exit_code != 0 }}"
        then:
          - id: bug-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
              latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" bugs 2>/dev/null || true);
              export STATE_DIR="{{ inputs.state_dir }}";
              export LATEST="$latest";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor --prompt-file "$PROMPTS_DIR/bug-fix.md";

  - id: bug-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" bugs 2>/dev/null); then
      echo "BUGS REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: bug review loop exhausted all iterations without 'BUGS: PASS' (latest review: ${last:-none}); inspect the latest bug-review file and the code";
      fi

  - id: review-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.verdict.output.exit_code != 0 }}"
    steps:
      - id: review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
          set -euo pipefail;
          latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" review 2>/dev/null || true);
          n=1;
          if [ -n "$latest" ]; then
          b=$(basename "$latest");
          num=${b#review-};
          num=${num%.md};
          case "$num" in ''|*[!0-9]*) num=0;; esac;
          n=$((num+1));
          fi;
          export STATE_DIR="{{ inputs.state_dir }}";
          export LATEST="$latest";
          export N="$n";
          snapfile="{{ inputs.state_dir }}/tasks/current/review-snapshot.sha";
          if [ -s "$snapfile" ]; then
          snap=$(cat "$snapfile");
          export SNAP="$snap";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/review-rereview.md";
          else
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/review.md";
          fi;
          snap=$(git stash create 2>/dev/null || true);
          [ -n "$snap" ] || snap=HEAD;
          printf '%s' "$snap" > "$snapfile";

      - id: verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" review

      - id: fix-branch
        type: if
        condition: "{{ steps.verdict.output.exit_code != 0 }}"
        then:
          - id: fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
              latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" review 2>/dev/null || true);
              export STATE_DIR="{{ inputs.state_dir }}";
              export LATEST="$latest";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor --prompt-file "$PROMPTS_DIR/fix.md";

  - id: pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" review 2>/dev/null); then
      echo "REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: review loop exhausted all iterations without 'VERDICT: PASS' (latest review: ${last:-none}); inspect the latest review file and the code";
      fi

  - id: comment-review-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.comment-verdict.output.exit_code != 0 }}"
    steps:
      - id: comment-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
          set -euo pipefail;
          latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" comment 2>/dev/null || true);
          n=1;
          if [ -n "$latest" ]; then
          b=$(basename "$latest");
          num=${b#comment-review-};
          num=${num%.md};
          case "$num" in ''|*[!0-9]*) num=0;; esac;
          n=$((num+1));
          fi;
          export STATE_DIR="{{ inputs.state_dir }}";
          export LATEST="$latest";
          export N="$n";
          snapfile="{{ inputs.state_dir }}/tasks/current/comment-snapshot.sha";
          if [ -s "$snapfile" ]; then
          snap=$(cat "$snapfile");
          export SNAP="$snap";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/comment-rereview.md";
          else
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/comment-review.md";
          fi;
          snap=$(git stash create 2>/dev/null || true);
          [ -n "$snap" ] || snap=HEAD;
          printf '%s' "$snap" > "$snapfile";

      - id: comment-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" comment

      - id: comment-fix-branch
        type: if
        condition: "{{ steps.comment-verdict.output.exit_code != 0 }}"
        then:
          - id: comment-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
              latest=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" comment 2>/dev/null || true);
              export STATE_DIR="{{ inputs.state_dir }}";
              export LATEST="$latest";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor --prompt-file "$PROMPTS_DIR/review/comment-fix.md";

  - id: comment-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" comment 2>/dev/null); then
      echo "COMMENT REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: comment review loop exhausted all iterations without 'VERDICT: PASS' (latest review: ${last:-none}); inspect the latest comment-review file and the code";
      fi

  - id: report
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      PROMPTS_DIR="${SKLC_PROMPTS_DIR:-$HOME/.config/spec-kit-llm-client/prompts}";
      set -euo pipefail;
      srp_last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" srp 2>/dev/null || true);
      bugs_last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" bugs 2>/dev/null || true);
      review_last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" review 2>/dev/null || true);
      comment_last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "" comment 2>/dev/null || true);
      export STATE_DIR="{{ inputs.state_dir }}";
      export SRP_LAST="$srp_last";
      export BUGS_LAST="$bugs_last";
      export REVIEW_LAST="$review_last";
      export COMMENT_LAST="$comment_last";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" planner --prompt-file "$PROMPTS_DIR/review/report.md";

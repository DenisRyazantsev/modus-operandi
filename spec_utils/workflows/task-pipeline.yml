# WARNING: the literal `timeout:` and `max_iterations:` values in this file
# are placeholders, not operative settings. The specify engine accepts only
# literal integers for these keys (no expressions), so the installer's
# spec_utils/render.py `_patch_workflow_numbers` overwrites every `timeout`
# with workflow.shell_timeout and each loop's `max_iterations` with its
# max_*_iterations config value at install/`--apply` time — editing the
# numbers here silently has no effect on installed workflows. Exception:
# `motivation-loop` is deliberately absent from `_LOOP_ITERATION_KEYS`
# (ADR-0011), so its `max_iterations: 100` literal IS the operative ceiling —
# the engine silently falls back to 10 on an invalid value, which is why the
# loop is not "infinite". Everything
# else is delivered at runtime: state_dir and adr_dir arrive as -i inputs,
# and the script paths come from the SKLC_SCRIPTS_DIR env var (defaulting to
# $HOME/.config/opencode/scripts for direct `specify workflow run`).
#
# CONTRIBUTING.md: this file contains NO bash scripts. Every shell step calls
# exactly one installed script (pipeline_scripts/) with quoted arguments; all
# logic lives in the scripts. The only shell syntax allowed in a run: value
# is the single path expansion locating the scripts directory.
schema_version: "1.0"
workflow:
  id: "task-pipeline"
  name: "Task Pipeline"
  version: "1.0.0"
  author: "spec-kit-llm-client"
  description: "Task -> motivation study -> research -> ADR -> implementation -> review-fix loop"

inputs:
  task:
    type: string
    required: true
    prompt: "Describe the task you want to solve"
  task_id:
    type: string
    required: false
    prompt: "Short id for this task (optional; generated from the task otherwise)"
  state_dir:
    type: string
    required: false
    default: ".workflow"
    prompt: "Task artifact directory inside the project (from workflow.state_dir)"
  adr_dir:
    type: string
    required: false
    default: "architecture"
    prompt: "Directory where approved ADRs are saved (from workflow.adr_dir)"
  motivation_verdict:
    type: string
    enum: ["", clear, clarify]
    default: "clear"
    prompt: "Motivation gate verdict: empty = ask the human, otherwise the auto-choice"

steps:
  - id: validate-task-id
    type: shell
    run: >-
      python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/validate_inputs.py"
      task-id "{{ context.run_id }}"

  - id: validate-task
    type: shell
    run: >-
      python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/validate_inputs.py"
      task "{{ context.run_id }}"

  - id: generate-task-id
    type: shell
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/adr-task-id.sh"
      "{{ inputs.state_dir }}"
      "{{ inputs.task_id }}"
      "{{ inputs.task }}"

  - id: study
    type: shell
    timeout: 7200
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
      "{{ inputs.state_dir }}"
      planner
      task/study.md
      --export "TASK={{ inputs.task }}"

  # No final fallback gate after the motivation loop: continuing to research
  # with a partially clarified motivation is intentional. The loop is
  # effectively unlimited: max_iterations is a literal (the engine accepts no
  # expressions and silently falls back to 10 on an invalid value, so the
  # ceiling is 100 - practically unreachable - instead of "infinite").
  - id: motivation-loop
    type: do-while
    max_iterations: 100
    condition: "{{ steps.motivation-gate.output.choice != 'clear' }}"
    steps:
      - id: study-display
        type: shell
        run: >-
          "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/show-file.sh"
          "{{ inputs.state_dir }}"
          "tasks/current/study.md"
      - id: motivation-gate
        type: gate
        message: >-
          The motivation study is ready — clear, or clarify?

          {{ steps.study-display.output.stdout }}
        options: [clear, clarify]
        # No reject/abort choice here by design (there is no later agreement
        # gate), so on_reject must not default to 'abort' — the engine's gate
        # validation requires a reject/abort option then. 'skip' documents
        # that this gate only records the choice; the do-while condition and
        # max_iterations handle the loop exit.
        on_reject: skip
        verdict_input: motivation_verdict
      - id: motivation-revise-branch
        type: if
        condition: "{{ steps.motivation-gate.output.choice == 'clarify' }}"
        then:
          - id: motivation-feedback-gate
            type: gate
            message: >-
              Feedback on the motivation study is collected in
              {{ inputs.state_dir }}/tasks/current/feedback.md — the wrapper opens it
              in your editor: on macOS the run continues automatically when the
              editor closes; on Linux close the editor window and choose
              continue. If no editor opened, create the file manually
              and write your feedback, then choose continue. The planner
              will update study.md accordingly.
            options: [continue, abort]
          - id: study-revise
            type: shell
            timeout: 7200
            run: >-
              "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
              "{{ inputs.state_dir }}"
              planner
              task/study-revise.md
          - id: motivation-feedback-clear
            type: shell
            run: >-
              "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/clear-feedback.sh"
              "{{ inputs.state_dir }}"

  - id: research
    type: shell
    timeout: 7200
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
      "{{ inputs.state_dir }}"
      planner
      task/research.md

  - id: write-adr
    type: shell
    timeout: 7200
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
      "{{ inputs.state_dir }}"
      planner
      task/write-adr.md

  - id: save-adr
    type: shell
    timeout: 7200
    run: >-
      python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/save_adr.py"
      save "{{ inputs.state_dir }}" "{{ inputs.task_id }}" "{{ inputs.adr_dir }}"
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/run-agent.sh"

  - id: executor-questions-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.questions-check.output.exit_code != 0 }}"
    steps:
      - id: executor-questions
        type: shell
        timeout: 7200
        run: >-
          "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
          "{{ inputs.state_dir }}"
          executor
          adr/executor-questions.md
      - id: questions-check
        type: shell
        continue_on_error: true
        run: >-
          python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_questions.py"
          check "{{ inputs.state_dir }}" "{{ inputs.task_id }}"
      - id: questions-branch
        type: if
        condition: "{{ steps.questions-check.output.exit_code != 0 }}"
        then:
          - id: planner-answers
            type: shell
            timeout: 7200
            run: >-
              "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
              "{{ inputs.state_dir }}"
              planner
              adr/planner-answers.md

  - id: implement
    type: shell
    timeout: 7200
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
      "{{ inputs.state_dir }}"
      executor
      adr/implement.md

  - id: implement-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.implement-verify.output.exit_code != 0 }}"
    steps:
      - id: implement-verify
        type: shell
        continue_on_error: true
        run: >-
          python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_implementation.py"
          check "{{ inputs.adr_dir }}"
      - id: implement-retry-branch
        type: if
        condition: "{{ steps.implement-verify.output.exit_code != 0 }}"
        then:
          - id: implement-retry
            type: shell
            timeout: 7200
            run: >-
              "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/implement-retry.sh"
              "{{ inputs.state_dir }}"

  - id: implement-pass-check
    type: shell
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/implement-pass-check.sh"
      "{{ inputs.state_dir }}"
      "{{ inputs.adr_dir }}"
      "{{ context.run_id }}"

  - id: review-fix-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
    steps:
      - id: pending-kinds
        type: shell
        run: >-
          python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_review.py"
          pending "{{ inputs.state_dir }}" "{{ inputs.task_id }}"

      - id: review-fan
        type: fan-out
        max_concurrency: 4
        items: "{{ steps.pending-kinds.output.stdout | from_json }}"
        step:
          id: check
          type: shell
          timeout: 7200
          run: >-
            "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/review-check.sh"
            "{{ inputs.state_dir }}"
            "{{ inputs.task_id }}"
            "{{ item }}"
            adr

      - id: merge-reports
        type: shell
        continue_on_error: true
        run: >-
          python3 "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/check_review.py"
          merge "{{ inputs.state_dir }}" "{{ inputs.task_id }}"

      - id: fix-branch
        type: if
        condition: "{{ steps.merge-reports.output.exit_code != 0 }}"
        then:
          - id: fix-all
            type: shell
            timeout: 7200
            run: >-
              "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/agent-step.sh"
              "{{ inputs.state_dir }}"
              executor
              fix-all.md

  - id: sync-adr
    type: shell
    timeout: 7200
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/sync-adr.sh"
      "{{ inputs.state_dir }}"
      "{{ inputs.task_id }}"

  - id: pass-check
    type: shell
    run: >-
      "${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}/pass-check.sh"
      "{{ inputs.state_dir }}"
      "{{ inputs.task_id }}"

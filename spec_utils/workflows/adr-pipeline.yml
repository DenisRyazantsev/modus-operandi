# WARNING: the literal `timeout:` and `max_iterations:` values in this file
# are placeholders, not operative settings. The specify engine accepts only
# literal integers for these keys (no expressions), so the installer's
# spec_utils/render.py `_patch_workflow_numbers` overwrites every `timeout`
# with workflow.shell_timeout and each loop's `max_iterations` with its
# max_*_iterations config value at install/`--apply` time — editing the
# numbers here silently has no effect on installed workflows. Everything
# else is delivered at runtime: state_dir and adr_dir arrive as -i inputs,
# and the script paths come from the SKLC_SCRIPTS_DIR env var (defaulting to
# $HOME/.config/opencode/scripts for direct `specify workflow run`).
schema_version: "1.0"
workflow:
  id: "adr-pipeline"
  name: "ADR Pipeline"
  version: "1.0.0"
  author: "spec-kit-llm-client"
  description: "Planner -> executor cycle: ADR, questions, implementation, review-fix loop"

inputs:
  feature:
    type: string
    required: true
    prompt: "Describe what you want to build"
  task_id:
    type: string
    required: false
    prompt: "Short id for this task (optional; generated from the feature otherwise)"
  state_dir:
    type: string
    required: false
    default: ".workflow"
    prompt: "Task artifact directory inside the project (from workflow.state_dir)"
  adr_dir:
    type: string
    required: false
    default: "architecture"
    prompt: "Directory where approved ADRs are saved (from workflow.adr_dir)"
  adr_verdict:
    type: string
    enum: ["", approve, revise, reject]
    default: "approve"
    prompt: "ADR gate verdict: empty = ask the human, otherwise the auto-choice"

steps:
  - id: validate-task-id
    type: shell
    run: |
      # The task_id is later embedded inside double-quoted shell arguments
      # (generate-task-id, save-adr), so it must be rejected if it contains
      # anything outside [A-Za-z0-9_-]: a quote, backtick, dollar sign or
      # backslash would break out of the quoted context and execute shell
      # BEFORE this check could reject it (a task id like `"; touch x; echo "`
      # runs the touch while the step text is rendered). It must NOT be read
      # through a heredoc (see validate-feature for why); the value is read as
      # JSON data from the run's persisted inputs and validated in python,
      # where the text never enters a shell context.
      run_id="{{ context.run_id }}";
      [ -n "$run_id" ] || { echo "error: cannot locate the current run state; cannot validate the task_id input" >&2; exit 1; };
      python3 -c '
      import json, re, sys
      try:
          data = json.load(open(".specify/workflows/runs/" + sys.argv[1] + "/inputs.json", encoding="utf-8"))
      except OSError as exc:
          print("error: cannot read run inputs: " + str(exc), file=sys.stderr)
          sys.exit(1)
      task_id = (data.get("inputs") or {}).get("task_id") or ""
      if task_id and not re.fullmatch(r"[A-Za-z0-9_-]+", task_id):
          print("error: task_id contains unsupported characters; use only letters, digits, underscore or dash", file=sys.stderr)
          sys.exit(1)
      ' "$run_id" || exit 1;

  - id: validate-feature
    type: shell
    run: |
      # The feature is later embedded inside double-quoted shell arguments
      # (generate-task-id, write-adr), so it must be rejected if it contains
      # characters that could break out of those quotes (double quote,
      # backtick, dollar sign, backslash). It must NOT be read through a
      # heredoc: a feature line equal to the delimiter would terminate the
      # heredoc at parse time and the remaining feature lines would execute
      # as shell, and an unquoted (expanded) delimiter would expand the
      # body, executing command substitutions before any check runs. So
      # the value is read as JSON data from the run's persisted inputs and
      # validated in python, where the feature text never enters a shell
      # context.
      # The run id comes from the workflow context ({{ context.run_id }}), not
      # from "newest directory by mtime": a concurrently started run, or a
      # resumed run whose directory keeps its original mtime, would make the
      # newest-directory lookup pick a different run and silently skip or
      # wrongly reject this feature's validation.
      run_id="{{ context.run_id }}";
      [ -n "$run_id" ] || { echo "error: cannot locate the current run state (.specify/workflows/runs); cannot validate the feature input" >&2; exit 1; };
      python3 -c '
      import json, re, sys
      try:
          data = json.load(open(".specify/workflows/runs/" + sys.argv[1] + "/inputs.json", encoding="utf-8"))
      except OSError as exc:
          print("error: cannot read run inputs: " + str(exc), file=sys.stderr)
          sys.exit(1)
      feature = (data.get("inputs") or {}).get("feature") or ""
      if re.search(r"[\"`$\\]", feature):
          print("error: feature contains characters unsafe for shell (quote, backtick, dollar, backslash); rephrase it", file=sys.stderr)
          sys.exit(1)
      ' "$run_id" || exit 1;

  - id: generate-task-id
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      set -euo pipefail;
      mkdir -p "{{ inputs.state_dir }}/tasks";
      if [ -n "{{ inputs.task_id }}" ]; then
      tid="{{ inputs.task_id }}";
      else
      slug=$("$SKLC_SCRIPTS_DIR/name-task.sh" "{{ inputs.feature }}");
      slug=$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40);
      [ -n "$slug" ] || slug=task;
      tid="$slug-$(date +%Y%m%d-%H%M)";
      fi;
      mkdir -p "{{ inputs.state_dir }}/tasks/$tid";
      ln -sfn "$tid" "{{ inputs.state_dir }}/tasks/current";
      echo "task id: $tid";

  - id: write-adr
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
      "Write an ADR for the following feature into {{ inputs.state_dir }}/tasks/current/adr.md
      with sections: Context, Decision, Alternatives, Consequences, Acceptance Criteria.
      Feature: {{ inputs.feature }}"

  - id: adr-loop
    type: do-while
    max_iterations: 3
    condition: "{{ steps.adr-gate.output.choice != 'approve' }}"
    steps:
      - id: adr-gate
        type: gate
        message: "ADR is ready — approve, revise, or reject?"
        options: [approve, revise, reject]
        on_reject: abort
        show_file: "{{ inputs.state_dir }}/tasks/current/adr.md"
        verdict_input: adr_verdict
      - id: adr-revise-branch
        type: if
        condition: "{{ steps.adr-gate.output.choice == 'revise' }}"
        then:
          - id: adr-feedback-gate
            type: gate
            message: >-
              Feedback on the ADR is collected in
              {{ inputs.state_dir }}/tasks/current/feedback.md — the wrapper opens it
              in your editor and the run continues automatically when the
              editor closes. If no editor opened, create the file manually
              and write your feedback, then choose continue. The planner
              will update adr.md accordingly.
            options: [continue, abort]
          - id: adr-revise
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
              "Read {{ inputs.state_dir }}/tasks/current/feedback.md. If it contains
              feedback, update {{ inputs.state_dir }}/tasks/current/adr.md accordingly.
              If it is empty or missing, do nothing."
          - id: adr-feedback-clear
            type: shell
            run: "rm -f {{ inputs.state_dir }}/tasks/current/feedback.md"

  - id: adr-unapproved
    type: if
    condition: "{{ steps.adr-gate.output.choice != 'approve' }}"
    then:
      - id: adr-approval-gate
        type: gate
        message: >-
          The ADR was not approved within the review rounds (last choice:
          {{ steps.adr-gate.output.choice }}). Approve it to save the ADR
          into {{ inputs.adr_dir }}/, or abort the run.
        options: [approve, abort]
        on_reject: abort
        show_file: "{{ inputs.state_dir }}/tasks/current/adr.md"

  - id: save-adr
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      python3 "$SKLC_SCRIPTS_DIR/save_adr.py" save "{{ inputs.state_dir }}" "{{ inputs.task_id }}" "{{ inputs.adr_dir }}" "$SKLC_SCRIPTS_DIR/run-agent.sh"

  - id: executor-questions
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
      "Read {{ inputs.state_dir }}/tasks/current/adr.md. If anything is ambiguous, write
      {{ inputs.state_dir }}/tasks/current/questions.md whose first line is exactly
      'QUESTIONS: PRESENT' followed by your numbered questions, then stop. If everything is
      clear, write {{ inputs.state_dir }}/tasks/current/questions.md with the first line
      exactly 'QUESTIONS: NONE'."

  - id: planner-answers
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
      "Read {{ inputs.state_dir }}/tasks/current/questions.md. If its first line is
      'QUESTIONS: PRESENT', write {{ inputs.state_dir }}/tasks/current/answers.md answering
      each question line-by-line in the same order. If it is 'QUESTIONS: NONE', write nothing."

  - id: implement
    type: shell
    timeout: 7200
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
      "Implement the feature per {{ inputs.state_dir }}/tasks/current/adr.md and
      {{ inputs.state_dir }}/tasks/current/answers.md (if present). Then run the project's
      tests/linter if available. If you must deviate from the ADR (e.g. it describes
      something impossible or clearly suboptimal), write {{ inputs.state_dir }}/tasks/current/deviation.md
      recording: what the ADR says, what you did instead, and why. Do not create the file
      when there is no deviation."

  - id: implement-loop
    type: do-while
    max_iterations: 2
    condition: "{{ steps.implement-verify.output.exit_code != 0 }}"
    steps:
      - id: implement-verify
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_implementation.py" check "{{ inputs.adr_dir }}"
      - id: implement-retry-branch
        type: if
        condition: "{{ steps.implement-verify.output.exit_code != 0 }}"
        then:
          - id: implement-retry
            type: shell
            timeout: 7200
            run: |
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              # The first loop iteration asks the executor to redo the work;
              # the marker keeps the loop from asking a second time (a second
              # empty verify must fail the run, not repeat the prompt).
              if [ -f "{{ inputs.state_dir }}/tasks/current/.implement-retried" ]; then
              echo "already retried once; the run will fail";
              exit 0;
              fi;
              touch "{{ inputs.state_dir }}/tasks/current/.implement-retried";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor "You didn't do changes.";

  - id: implement-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if python3 "$SKLC_SCRIPTS_DIR/check_implementation.py" check "{{ inputs.adr_dir }}"; then
      echo "IMPLEMENT OK: changes present";
      else
      echo "error: the executor made no changes to the repository in two attempts (task state: {{ inputs.state_dir }}/tasks/current; agent log: {{ inputs.state_dir }}/logs); resume with: specify workflow resume {{ context.run_id }}" >&2;
      exit 1;
      fi

  - id: srp-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.srp-verdict.output.exit_code != 0 }}"
    steps:
      - id: srp-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
          "Review the git changes for SRP violations ONLY: the single-responsibility
          principle — every class, function and module must have one clear
          responsibility, with no god classes/functions and no mixed concerns in one
          unit. Do NOT review ADR compliance, tests, or any other quality aspect
          (a later stage does that). Run git status, then git diff HEAD (includes
          staged changes). Write {{ inputs.state_dir }}/tasks/current/srp-review-N.md
          (N is the next number after the existing srp-review files) with the first
          line exactly 'SRP: PASS' or 'SRP: FIX' followed by actionable findings."

      - id: srp-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" srp

      - id: srp-fix-branch
        type: if
        condition: "{{ steps.srp-verdict.output.exit_code != 0 }}"
        then:
          - id: srp-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
              "Read the latest {{ inputs.state_dir }}/tasks/current/srp-review-N.md
              and fix all its SRP findings. Then run the project's tests/linter if
              available."

  - id: srp-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" srp 2>/dev/null); then
      echo "SRP REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: SRP review loop exhausted all iterations without 'SRP: PASS' (latest review: ${last:-none}); inspect the latest srp-review file and the code";
      fi

  - id: bug-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.bug-verdict.output.exit_code != 0 }}"
    steps:
      - id: bug-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
          "Review the git changes for BUGS ONLY: logic errors, wrong conditions,
          off-by-one and edge cases, unhandled errors, races, broken control flow,
          wrong types/units, and discrepancies between the implemented behavior and
          the acceptance criteria in {{ inputs.state_dir }}/tasks/current/adr.md.
          Do NOT review SRP violations, ADR-format compliance, or comment quality
          (later stages do that). Run git status, then git diff HEAD (includes
          staged changes). Write {{ inputs.state_dir }}/tasks/current/bug-review-N.md
          (N is the next number after the existing bug-review files) with the first
          line exactly 'BUGS: PASS' or 'BUGS: FIX' followed by actionable findings."

      - id: bug-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" bugs

      - id: bug-fix-branch
        type: if
        condition: "{{ steps.bug-verdict.output.exit_code != 0 }}"
        then:
          - id: bug-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
              "Read the latest {{ inputs.state_dir }}/tasks/current/bug-review-N.md
              and fix all its bug findings. Then run the project's tests/linter if
              available."

  - id: bug-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" bugs 2>/dev/null); then
      echo "BUGS REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: bug review loop exhausted all iterations without 'BUGS: PASS' (latest review: ${last:-none}); inspect the latest bug-review file and the code";
      fi

  - id: review-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.verdict.output.exit_code != 0 }}"
    steps:
      - id: review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
          "Review the git changes against {{ inputs.state_dir }}/tasks/current/adr.md.
          First read {{ inputs.state_dir }}/tasks/current/deviation.md if present: if it
          records a justified deviation from the ADR, evaluate the code against the ADR as
          amended by that deviation and do not report the deviation itself as a finding.
          If the deviation file is missing or unjustified, report the mismatch as a finding.
          Run git status, then git diff HEAD (includes staged changes). Write
          {{ inputs.state_dir }}/tasks/current/review-N.md (N is the next number after the
          existing review files) with the first line exactly 'VERDICT: PASS' or
          'VERDICT: FIX' followed by actionable findings. The verdict must reflect the
          implemented code, not the ADR document."

      - id: verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" review

      - id: fix-branch
        type: if
        condition: "{{ steps.verdict.output.exit_code != 0 }}"
        then:
          - id: fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
              "Read the latest {{ inputs.state_dir }}/tasks/current/review-N.md and fix all its
              findings. Then run the project's tests/linter if available."

  - id: sync-adr
    type: shell
    timeout: 7200
    run: |
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      set -euo pipefail
      if [ -f "{{ inputs.state_dir }}/tasks/current/deviation.md" ]; then
      "$SKLC_SCRIPTS_DIR/run-agent.sh" planner "Read {{ inputs.state_dir }}/tasks/current/deviation.md and {{ inputs.state_dir }}/tasks/current/adr.md. Update adr.md so it reflects the recorded deviation: append an '## Amendments' section (do not rewrite the Decision) noting what changed and why."
      python3 "$SKLC_SCRIPTS_DIR/save_adr.py" sync "{{ inputs.state_dir }}" "{{ inputs.task_id }}"
      rm -f "{{ inputs.state_dir }}/tasks/current/deviation.md"
      else
      echo "no deviation recorded"
      fi

  - id: pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" review 2>/dev/null); then
      echo "REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: review loop exhausted all iterations without 'VERDICT: PASS' (latest review: ${last:-none}); inspect the latest review file and the code";
      fi

  - id: comment-review-loop
    type: do-while
    max_iterations: 5
    condition: "{{ steps.comment-verdict.output.exit_code != 0 }}"
    steps:
      - id: comment-review
        type: shell
        timeout: 7200
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          "$SKLC_SCRIPTS_DIR/run-agent.sh" planner
          "Review the git changes for readability 'traps' ONLY: places that are
          correct but would mislead a reader, NOT bugs. Act as a senior code
          reviewer opening this file for the first time: find only the spots where
          a reader would make a wrong assumption about what the code does and why
          it is written this way. Comment only the WHY, never the WHAT; apply the
          Chesterton's fence test (don't suggest removing things you don't yet
          understand); prefer a rename/refactor over a comment; judge against a
          typical reader of this codebase; if there are no findings return an empty
          list (noise is worse than silence). Check these triggers in order: magic
          numbers/constants, workarounds/hacks, non-standard API use, swallowed
          exceptions, edge cases, business rules inside conditions, implicit
          invariants, strange optimizations, external constraints, known
          limitations/tech debt. Run git status, then git diff HEAD (includes
          staged changes). Write {{ inputs.state_dir }}/tasks/current/comment-review-N.md
          (N is the next number after the existing comment-review files) with the
          first line exactly 'VERDICT: PASS' or 'VERDICT: FIX'. If PASS, write
          nothing else. If FIX, list findings in this strict format, one per block:
          <file:line>
          Why a reader would be misled: <one sentence>
          Comment: <1-2 lines, WHY only, in English>
          Verdict: COMMENT | REFACTOR"

      - id: comment-verdict
        type: shell
        continue_on_error: true
        run: >-
          SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
          python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" comment

      - id: comment-fix-branch
        type: if
        condition: "{{ steps.comment-verdict.output.exit_code != 0 }}"
        then:
          - id: comment-fix
            type: shell
            timeout: 7200
            run: >-
              SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
              "$SKLC_SCRIPTS_DIR/run-agent.sh" executor
              "Read the latest {{ inputs.state_dir }}/tasks/current/comment-review-N.md
              and apply all its findings: for each Verdict: COMMENT add the
              suggested why-comment to the code; for each Verdict: REFACTOR perform
              the rename/refactor instead of adding a comment. Then run the
              project's tests/linter if available."

  - id: comment-pass-check
    type: shell
    run: >-
      SKLC_SCRIPTS_DIR="${SKLC_SCRIPTS_DIR:-$HOME/.config/opencode/scripts}";
      if last=$(python3 "$SKLC_SCRIPTS_DIR/check_review.py" check-review "{{ inputs.state_dir }}" "{{ inputs.task_id }}" comment 2>/dev/null); then
      echo "COMMENT REVIEW OK: final verdict PASS ($last)";
      else
      echo "WARNING: comment review loop exhausted all iterations without 'VERDICT: PASS' (latest review: ${last:-none}); inspect the latest comment-review file and the code";
      fi

version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    # Floors in pyproject.toml are deliberate minimums (tested lowest-and-latest);
    # Dependabot keeps uv.lock current within those ranges instead of raising floors.
    versioning-strategy: lockfile-only
    groups:
      all-dependencies:
        patterns:
          - "*"


name: Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  test:
    needs: lint
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    uses: ./.github/workflows/build.yml
